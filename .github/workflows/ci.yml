name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: advanced_hello_world
          POSTGRES_USER: advanced_hello_world
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advanced_hello_world"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: YutakaX17/advanced-hello-world-be-core
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ./core -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: advanced_hello_world.settings.production
          DJANGO_SECRET_KEY: ci-only-secure-key-that-is-long-enough

